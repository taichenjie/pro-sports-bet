[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "psb"
version = "0.1.0"
description = "Pro Sports Bet: metrics-driven football bet model for J1 League and Serie A"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/psb"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
